name: FakeWallet
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: "5.0"
  TARGETED_DEVICE_FAMILY: "1"
targets:
  FakeWallet:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
      - path: LaunchScreen.storyboard
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Keeper
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchStoryboardName: LaunchScreen
        UILaunchScreen:
          UIColorName: black
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.fakewallet.full
        PRODUCT_NAME: Keeper
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "16"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
schemes:
  FakeWallet:
    build:
      targets:
        FakeWallet: all
    run:
      config: Debug
    archive:
      config: Release
