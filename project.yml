name: FakeWallet
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: "5.0"
  TARGETED_DEVICE_FAMILY: "1"
targets:
  FakeWallet:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
          - "LaunchScreen.storyboard"
      - path: Assets.xcassets
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.fakewallet.screen
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "7"
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  FakeWallet:
    build:
      targets:
        FakeWallet: all
    run:
      config: Debug
    archive:
      config: Release
